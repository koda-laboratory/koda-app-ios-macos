name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: ${{ matrix.name }}
    runs-on: macos-26
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: iOS
            build-destination: generic/platform=iOS Simulator
            test-destination: platform=iOS Simulator,name=iPhone 17
          - name: macOS
            build-destination: platform=macOS
            test-destination: platform=macOS
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode_27*.app | sort -V | tail -1)"

      - name: Cache Swift packages
        uses: actions/cache@v4
        with:
          path: .build/SourcePackages
          key: spm-${{ runner.os }}-${{ hashFiles('Koda.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}

      - name: Install SwiftLint
        run: brew install swiftlint

      - name: Build
        run: |
          set -o pipefail
          xcodebuild -project Koda.xcodeproj -scheme Koda \
            -destination '${{ matrix.build-destination }}' \
            -derivedDataPath .build/DerivedData \
            -clonedSourcePackagesDirPath .build/SourcePackages \
            -skipPackagePluginValidation -skipMacroValidation \
            build CODE_SIGNING_ALLOWED=NO

      - name: Test
        run: |
          set -o pipefail
          xcodebuild -project Koda.xcodeproj -scheme Koda \
            -destination '${{ matrix.test-destination }}' \
            -derivedDataPath .build/DerivedData \
            -clonedSourcePackagesDirPath .build/SourcePackages \
            -skipPackagePluginValidation -skipMacroValidation \
            test CODE_SIGNING_ALLOWED=NO

  format:
    name: swift-format
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode_27*.app | sort -V | tail -1)"
      - name: Lint formatting
        run: xcrun swift-format lint --strict --recursive --configuration .swift-format Koda KodaWidgets KodaTests
