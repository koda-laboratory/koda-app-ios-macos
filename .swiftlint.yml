reporter: xcode

disabled_rules:
  - line_length
  - opening_brace
  - orphaned_doc_comment
  - trailing_comma

opt_in_rules:
  - unowned_variable_capture
  - closure_spacing
  - empty_count
  - empty_string
  - fatal_error_message
  - force_unwrapping
  - implicitly_unwrapped_optional
  - operator_usage_whitespace

included:
  - Koda
  - KodaWidgets
  - KodaTests

excluded:
  - .build
  - .build-benchmark

identifier_name:
  max_length:
    warning: 60
    error: 80
  allowed_symbols: ["_"]
  excluded:
    # Conventional identifier required by Identifiable.
    - id
    # GRDB's conventional name for the `Database` connection.
    - db
    # Field name of the sync contract (`op: upsert | delete`).
    - op

type_name:
  max_length:
    warning: 80

function_body_length:
  warning: 300

function_parameter_count:
  warning: 6
  error: 8

type_body_length:
  warning: 300
  error: 500

file_length:
  warning: 1000
  error: 1500
  ignore_comment_only_lines: true

cyclomatic_complexity:
  warning: 15
  error: 25
  ignores_case_statements: true

large_tuple:
  warning: 3
  error: 4

colon:
  apply_to_dictionaries: false

empty_count:
  only_after_dot: true

custom_rules:
  no_objc_members:
    name: "@objcMembers"
    regex: "@objcMembers"
    message: "Explicitly use @objc on each member you want to expose to Objective-C."
    severity: error
  no_direct_standard_out_logs:
    name: "Writing log messages directly to standard out is disallowed"
    regex: "(\\bprint|\\bdebugPrint|\\bdump|Swift\\.print|Swift\\.debugPrint|Swift\\.dump)\\s*\\("
    match_kinds:
      - identifier
    message: "Do not commit print(...), debugPrint(...), or dump(...). Use OSLog.Logger, or explicitly disable this rule for a justified debug-only call."
    severity: warning
  no_file_literal:
    name: "#file is disallowed"
    regex: "(\\b#file\\b)"
    match_kinds:
      - identifier
    message: "Use #fileID instead of #file."
    severity: error
  no_filepath_literal:
    name: "#filePath is disallowed"
    regex: "(\\b#filePath\\b)"
    match_kinds:
      - identifier
    message: "Use #fileID instead of #filePath."
    severity: error
  no_unchecked_sendable:
    name: "@unchecked Sendable is discouraged"
    regex: "@unchecked Sendable"
    match_kinds:
      - attribute.builtin
      - typeidentifier
    message: "Prefer safe Sendable conformance or @preconcurrency import. If @unchecked Sendable is unavoidable, disable this rule locally and document why the type is thread-safe."
    severity: warning
